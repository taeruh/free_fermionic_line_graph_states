[package]
name = "core_lib"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["lib"]

[dependencies]
bitvec = { version = "1.0.1", default-features = false, features = [
  "std",
  "atomic",
] }
rand = { version = "0.10.0", default-features = false, features = [
  "alloc",
  "sys_rng",
  "std",
  "std_rng",
] }
rand_pcg = { version = "0.10.1", default-features = false }
